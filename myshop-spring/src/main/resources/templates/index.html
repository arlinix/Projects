<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout">
  <head>
    <title>MyShop — Home</title>
  </head>
  <body>
    <section>
      <h2>Featured Products</h2>
      <ul>
        <li th:each="p : ${products}">
          <span th:text="${p.productName}">Product</span> -
          <span th:text="${p.price}">Price</span>
          <a th:href="@{'/cart/add/' + ${p.id}}">Add to cart</a>
        </li>
      </ul>
    </section>
  </body>
</html>
